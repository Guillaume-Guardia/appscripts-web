<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#8f3d15" />
		<meta name="description" content="Le journal alimentaire de la maison : calories, macros, recettes et poids." />
		<title>Cuisine</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Cuisine" />
		<link rel="stylesheet" href="../shared/base.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="entete">
			<h1 id="titre">Cuisine</h1>
			<a href="../" class="bouton-icone" aria-label="Mes apps">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
				<span class="infobulle">Mes apps</span>
			</a>
			<button type="button" id="bouton-actualiser" class="bouton-icone" aria-label="Actualiser" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg>
				<span class="infobulle">Actualiser</span>
			</button>
			<button type="button" id="bouton-signalement" class="bouton-icone" aria-label="Suggestion ou bug">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v4M12 14h.01" /></svg>
				<span class="infobulle">Suggestion ou bug</span>
			</button>
			<button type="button" id="bouton-menu" class="bouton-icone" aria-label="Paramètres" aria-expanded="false" aria-controls="menu" hidden>
				<span class="avatar" aria-hidden="true"></span>
				<span class="infobulle">Paramètres</span>
			</button>
			<nav id="menu" class="menu" hidden>
				<button type="button" id="menu-profil" class="menu-carte">
					<span class="avatar" aria-hidden="true"></span>
					<span class="menu-carte-texte"><strong id="menu-compte"></strong><span>Mon profil</span></span>
				</button>
				<div class="menu-section">
					<p class="menu-titre">Cuisine</p>
					<button type="button" id="menu-objectifs">Mes objectifs</button>
					<button type="button" id="menu-nouveau-profil">Ajouter une personne</button>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Partager</p>
					<button type="button" id="menu-inviter">Inviter quelqu'un</button>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Cet appareil</p>
					<button type="button" role="switch" aria-checked="false" id="menu-biometrie" class="bascule" hidden>Biométrie</button>
					<button type="button" id="menu-installer" hidden>Installer l'app</button>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Mes autres appareils</p>
					<button type="button" id="menu-autre-appareil">Connecter un autre appareil</button>
				</div>
				<div class="menu-section">
					<button type="button" id="menu-deconnecter" class="danger">Se déconnecter</button>
				</div>
				<p class="version"></p>
			</nav>
		</header>
		<div id="chargement" class="chargement" hidden></div>
		<div id="bandeau" class="bandeau" hidden></div>

		<main>
			<section id="ecran-connexion" class="ecran-connexion" hidden>
				<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#bol" /></svg>
				<h2>Cuisine</h2>
				<p>Le journal alimentaire de la maison : calories, macros, recettes et poids.</p>
				<div id="connexion"></div>
				<div id="refus" hidden>
					<p id="message-refus" class="erreur" role="alert"></p>
					<button type="button" id="bouton-autre-compte">Se connecter avec un autre compte</button>
				</div>
				<p class="version"></p>
			</section>

			<!-- Journal, poids et recettes, une fois connecté : rendus par React (src/App.tsx), comme les dialogues. -->
			<div id="ecran-app" hidden></div>
		</main>

		<!-- Les vues : boutons rendus par React (Onglets, src/App.tsx). -->
		<nav id="onglets" class="onglets" aria-label="Vues" hidden></nav>

		<div id="toasts" class="toasts" aria-live="polite"></div>

		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<symbol id="bol" viewBox="0 0 64 64">
				<path d="M24 22c-2-3 2-5 0-8M32 22c-2-3 2-5 0-8M40 22c-2-3 2-5 0-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
				<path d="M10 28h44a22 22 0 0 1-44 0z" fill="currentColor" />
				<rect x="23" y="50" width="18" height="4" rx="2" fill="currentColor" />
			</symbol>
		</svg>

		<script src="../shared/config.js"></script>
		<script src="config.js"></script>
		<script src="version.js"></script>
		<script src="../shared/vendor/qrcode.min.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>

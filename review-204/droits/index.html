<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f5f66" />
		<meta name="description" content="Les comptes des apps et les apps ouvertes à chacun." />
		<meta name="robots" content="noindex" />
		<title>Droits</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Droits" />
		<link rel="stylesheet" href="../shared/base.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="entete">
			<h1 id="titre">Droits</h1>
			<a href="../" class="bouton-icone" aria-label="Mes apps">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
				<span class="infobulle">Mes apps</span>
			</a>
			<button type="button" id="bouton-actualiser" class="bouton-icone" aria-label="Actualiser" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg>
				<span class="infobulle">Actualiser</span>
			</button>
			<button type="button" id="bouton-signalement" class="bouton-icone" aria-label="Suggestion ou bug">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v4M12 14h.01" /></svg>
				<span class="infobulle">Suggestion ou bug</span>
			</button>
			<button type="button" id="bouton-menu" class="bouton-icone" aria-label="Paramètres" aria-expanded="false" aria-controls="menu" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M10.14 5.05L10.4 1.93L13.6 1.93L13.86 5.05L15.6 5.76L18 3.75L20.25 6L18.24 8.4L18.95 10.14L22.07 10.4L22.07 13.6L18.95 13.86L18.24 15.6L20.25 18L18 20.25L15.6 18.24L13.86 18.95L13.6 22.07L10.4 22.07L10.14 18.95L8.4 18.24L6 20.25L3.75 18L5.76 15.6L5.05 13.86L1.93 13.6L1.93 10.4L5.05 10.14L5.76 8.4L3.75 6L6 3.75L8.4 5.76z" /></svg>
				<span class="infobulle">Paramètres</span>
			</button>
			<nav id="menu" class="menu" hidden>
				<div class="menu-carte">
					<span class="avatar" aria-hidden="true"></span>
					<span class="menu-carte-texte"><strong id="menu-compte"></strong></span>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Cet appareil</p>
					<button type="button" role="switch" aria-checked="false" id="menu-biometrie" class="bascule" hidden>Biométrie</button>
					<button type="button" id="menu-installer" hidden>Installer l'app</button>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Mes autres appareils</p>
					<button type="button" id="menu-autre-appareil">Connecter un autre appareil</button>
				</div>
				<div class="menu-section">
					<button type="button" id="menu-deconnecter" class="danger">Se déconnecter</button>
				</div>
				<p class="version"></p>
			</nav>
		</header>
		<div id="chargement" class="chargement" hidden></div>
		<div id="bandeau" class="bandeau" hidden></div>

		<main>
			<section id="ecran-connexion" class="ecran-connexion" hidden>
				<h2>Droits</h2>
				<p>Les comptes des apps et les apps ouvertes à chacun.</p>
				<div id="connexion"></div>
				<p class="version"></p>
			</section>

			<section id="ecran-refus" class="ecran-connexion" hidden>
				<h2>Droits</h2>
				<p id="message-refus" class="aide"></p>
				<button type="button" id="bouton-deconnecter-refus">Se connecter avec un autre compte</button>
			</section>

			<section id="ecran-comptes" hidden>
				<div id="onglets-droits" class="onglets" role="tablist">
					<button type="button" role="tab" data-onglet="comptes" aria-controls="onglet-comptes">Comptes</button>
					<button type="button" role="tab" data-onglet="inviter" aria-controls="onglet-inviter">Inviter</button>
					<button type="button" role="tab" data-onglet="modes" aria-controls="onglet-modes">Modes</button>
				</div>

				<div id="onglet-comptes" role="tabpanel">
					<div class="filtres">
						<input id="recherche-comptes" type="search" placeholder="Prénom ou app" aria-label="Chercher un compte par prénom ou par app" autocomplete="off" />
						<select id="tri-comptes" aria-label="Tri des comptes">
							<option value="prenom">Prénom (A→Z)</option>
							<option value="recents">Récents d'abord</option>
						</select>
					</div>
					<div id="filtres-comptes" class="puces"></div>
					<p id="nombre-comptes" class="aide"></p>
					<div id="liste-comptes"></div>
					<p class="aide">Une app cochée est ouverte aussitôt ; décochée, elle se ferme au plus tard 10 minutes après.</p>
				</div>

				<div id="onglet-inviter" role="tabpanel" hidden>
					<div id="invitation"></div>
				</div>

				<div id="onglet-modes" role="tabpanel" hidden>
					<div id="modes-connexion"></div>
				</div>
			</section>
		</main>

		<div id="toasts" class="toasts" aria-live="polite"></div>

		<script src="../shared/config.js"></script>
		<script src="version.js"></script>
		<script src="../shared/vendor/qrcode.min.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>

<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f5f66" />
		<meta name="description" content="Les listes de bagages des voyages, selon la destination, la durée et le transport." />
		<title>Voyage</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Voyage" />
		<link rel="stylesheet" href="../shared/base.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="entete">
			<button type="button" id="bouton-retour" class="bouton-icone" aria-label="Retour aux voyages" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
			</button>
			<h1 id="titre">Voyages</h1>
			<a href="../" class="bouton-icone" aria-label="Mes apps">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
				<span class="infobulle">Mes apps</span>
			</a>
			<button type="button" id="bouton-actualiser" class="bouton-icone" aria-label="Actualiser" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg>
				<span class="infobulle">Actualiser</span>
			</button>
			<button type="button" id="bouton-signalement" class="bouton-icone" aria-label="Suggestion ou bug">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v4M12 14h.01" /></svg>
				<span class="infobulle">Suggestion ou bug</span>
			</button>
			<button type="button" id="bouton-menu" class="bouton-icone" aria-label="Paramètres" aria-expanded="false" aria-controls="menu" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M10.14 5.05L10.4 1.93L13.6 1.93L13.86 5.05L15.6 5.76L18 3.75L20.25 6L18.24 8.4L18.95 10.14L22.07 10.4L22.07 13.6L18.95 13.86L18.24 15.6L20.25 18L18 20.25L15.6 18.24L13.86 18.95L13.6 22.07L10.4 22.07L10.14 18.95L8.4 18.24L6 20.25L3.75 18L5.76 15.6L5.05 13.86L1.93 13.6L1.93 10.4L5.05 10.14L5.76 8.4L3.75 6L6 3.75L8.4 5.76z" /></svg>
				<span class="infobulle">Paramètres</span>
			</button>
			<nav id="menu" class="menu" hidden>
				<button type="button" id="menu-prenom" class="menu-carte">
					<span class="avatar" aria-hidden="true"></span>
					<span class="menu-carte-texte"><strong id="menu-compte"></strong><span>Changer mon prénom</span></span>
				</button>
				<div class="menu-section">
					<p class="menu-titre">Partager</p>
					<button type="button" id="menu-inviter">Inviter quelqu'un</button>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Cet appareil</p>
					<button type="button" role="switch" aria-checked="false" id="menu-biometrie" class="bascule" hidden>Biométrie</button>
					<button type="button" id="menu-installer" hidden>Installer l'app</button>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Mes autres appareils</p>
					<button type="button" id="menu-autre-appareil">Connecter un autre appareil</button>
				</div>
				<div class="menu-section">
					<button type="button" id="menu-deconnecter" class="danger">Se déconnecter</button>
				</div>
				<p class="version"></p>
			</nav>
		</header>
		<div id="chargement" class="chargement" hidden></div>
		<div id="bandeau" class="bandeau" hidden></div>

		<main>
			<section id="ecran-connexion" class="ecran-connexion" hidden>
				<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#valise" /></svg>
				<h2>Voyage</h2>
				<p>Les listes de bagages selon la destination, la durée et le transport.</p>
				<p class="aide">Connecte cet appareil à ton compte : QR code, lien ou biométrie.</p>
				<div id="connexion"></div>
				<p class="version"></p>
			</section>

			<section id="ecran-voyages" hidden>
				<div id="liste-voyages"></div>
				<button type="button" id="bouton-nouveau-voyage" class="bouton-flottant">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
					Nouveau voyage
				</button>
			</section>

			<section id="ecran-voyage" hidden>
				<div id="detail-voyage"></div>
			</section>
		</main>

		<dialog id="dialogue-voyage" class="dialogue" aria-labelledby="titre-dialogue-voyage">
			<form id="form-voyage" class="formulaire">
				<h2 id="titre-dialogue-voyage">Nouveau voyage</h2>
				<label for="champ-destination">Destination</label>
				<input id="champ-destination" maxlength="80" autocomplete="off" required />
				<div class="dates">
					<div>
						<label for="champ-depart">Départ</label>
						<input id="champ-depart" type="date" required />
					</div>
					<div>
						<label for="champ-retour">Retour</label>
						<input id="champ-retour" type="date" required />
					</div>
				</div>
				<p id="duree-voyage" class="aide"></p>
				<fieldset>
					<legend>Climat</legend>
					<div id="choix-climats" class="puces"></div>
				</fieldset>
				<fieldset>
					<legend>Transport</legend>
					<div id="choix-transports" class="puces"></div>
				</fieldset>
				<fieldset>
					<legend>Activités</legend>
					<div id="choix-activites" class="puces"></div>
					<div class="ajout-activite">
						<input id="champ-activite" maxlength="40" placeholder="Autre activité" autocomplete="off" aria-label="Autre activité" />
						<button type="button" id="bouton-ajouter-activite">Ajouter</button>
					</div>
				</fieldset>
				<label class="case">
					<input id="champ-etranger" type="checkbox" />
					À l'étranger <span class="aide">(passeport, adaptateur…)</span>
				</label>
				<p class="erreur" role="alert"></p>
				<div class="boutons">
					<button type="button" data-fermer>Annuler</button>
					<button type="submit" class="bouton-principal">Enregistrer</button>
				</div>
			</form>
		</dialog>

		<dialog id="dialogue-objet" class="dialogue" aria-labelledby="titre-dialogue-objet">
			<form id="form-objet" class="formulaire">
				<h2 id="titre-dialogue-objet">Ajouter un objet</h2>
				<label for="champ-objet">Objet</label>
				<input id="champ-objet" maxlength="80" autocomplete="off" required />
				<div class="dates">
					<div>
						<label for="champ-categorie">Catégorie</label>
						<input id="champ-categorie" list="liste-categories" maxlength="40" placeholder="Divers" autocomplete="off" />
					</div>
					<div class="quantite">
						<label for="champ-quantite">Quantité</label>
						<input id="champ-quantite" type="number" inputmode="numeric" min="1" max="99" step="1" value="1" required />
					</div>
				</div>
				<label class="case">
					<input id="champ-catalogue" type="checkbox" />
					L'ajouter au catalogue <span class="aide">(à chaque voyage)</span>
				</label>
				<p class="erreur" role="alert"></p>
				<div class="boutons">
					<button type="button" data-fermer>Annuler</button>
					<button type="submit" class="bouton-principal">Ajouter</button>
				</div>
			</form>
		</dialog>


		<datalist id="liste-categories"></datalist>
		<div id="toasts" class="toasts" aria-live="polite"></div>

		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<symbol id="valise" viewBox="0 0 64 64">
				<rect x="10" y="18" width="44" height="36" rx="7" fill="currentColor" />
				<path d="M24 18v-5a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v5" fill="none" stroke="currentColor" stroke-width="4" />
				<path d="M22 18v36M42 18v36" stroke="var(--fond, #fff)" stroke-width="3" opacity=".5" />
			</symbol>
		</svg>

		<script src="../shared/config.js"></script>
		<script src="config.js"></script>
		<script src="version.js"></script>
		<script src="../shared/vendor/qrcode.min.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>

<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Cadeaux</title>
	<meta name="description" content="Les listes de cadeaux de Noël de la famille">
	<meta name="theme-color" content="#a8201a" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#6e1a15" media="(prefers-color-scheme: dark)">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Cadeaux">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
	<link rel="stylesheet" href="style.css">
	<!-- config.js (adresse de l'API) et version.js sont générés à la publication : voir web/README.md. -->
	<script src="version.js" defer></script>
	<script src="../shared/vendor/qrcode.min.js" defer></script>
	<script src="../shared/config.js" defer></script>
	<script src="config.js" defer></script>
	<script type="module" src="app.js"></script>
</head>
<body>
	<div id="chargement" class="chargement" hidden></div>
	<div id="bandeau" class="bandeau" hidden></div>

	<!-- Connexion : compte (shared/connexion.js), puis invitation ou code famille -->
	<main id="ecran-connexion" class="connexion" hidden>
		<div class="connexion-carte">
			<img src="icons/icon.svg" alt="" class="connexion-logo" width="72" height="72">
			<h1>Cadeaux de Noël</h1>
			<p class="discret">Les listes de la famille, sans gâcher la surprise.</p>

			<div id="connexion-compte" class="pile" hidden></div>

			<!-- Attente, accès refusé, accueil (invitation, lien, code famille), choix du prénom : src/features/Connexion.tsx -->
			<div id="connexion-cadeaux" class="racine-react"></div>
			<p class="version discret"></p>
		</div>
	</main>

	<!-- Application -->
	<div id="ecran-app" class="app" hidden>
		<header class="entete">
			<div class="entete-titre">
				<p class="entete-sur" id="libelle-famille">Cadeaux de Noël</p>
				<h1 id="titre-onglet">Ma liste</h1>
			</div>
			<div class="entete-actions">
				<a href="../" class="icone-bouton" aria-label="Mes apps">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
					<span class="infobulle">Mes apps</span>
				</a>
				<button type="button" id="bouton-actualiser" class="icone-bouton" aria-label="Actualiser">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
					<span class="infobulle">Actualiser</span>
				</button>
				<button type="button" id="bouton-signalement" class="icone-bouton" aria-label="Suggestion ou bug">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v4M12 14h.01" /></svg>
					<span class="infobulle">Suggestion ou bug</span>
				</button>
				<button type="button" id="bouton-menu" class="icone-bouton" aria-label="Paramètres" aria-haspopup="menu" aria-expanded="false">
					<!-- Profil du membre : sa photo, ou l'initiale de son prénom (src/App.tsx, AvatarMembre). -->
					<span id="avatar-menu" class="avatar"></span>
					<span class="infobulle">Paramètres</span>
				</button>
				<div id="menu" class="menu" role="menu" hidden>
					<button type="button" role="menuitem" id="menu-profil" class="menu-carte">
						<span id="avatar-carte" class="avatar" aria-hidden="true"></span>
						<span class="menu-carte-texte"><strong id="menu-nom"></strong><span>Mon profil</span></span>
					</button>
					<!-- biome-ignore lint/a11y/useSemanticElements: groupe d'entrées d'un menu, pas un champ de formulaire. -->
					<div class="menu-section" role="group" aria-label="Cadeaux">
						<p class="menu-titre" aria-hidden="true">Cadeaux</p>
						<button type="button" role="menuitem" id="menu-visite">Visite guidée</button>
					</div>
					<!-- biome-ignore lint/a11y/useSemanticElements: groupe d'entrées d'un menu, pas un champ de formulaire. -->
					<div class="menu-section" role="group" aria-label="Cet appareil">
						<p class="menu-titre" aria-hidden="true">Cet appareil</p>
						<button type="button" role="menuitemcheckbox" aria-checked="false" id="menu-biometrie" class="bascule" hidden>Biométrie</button>
						<button type="button" role="menuitem" id="menu-installer" hidden>Installer l'app</button>
					</div>
					<!-- biome-ignore lint/a11y/useSemanticElements: groupe d'entrées d'un menu, pas un champ de formulaire. -->
					<div class="menu-section" role="group" aria-label="Mes autres appareils">
						<p class="menu-titre" aria-hidden="true">Mes autres appareils</p>
						<button type="button" role="menuitem" id="menu-autre-appareil">Connecter un autre appareil</button>
					</div>
					<div class="menu-section">
						<button type="button" role="menuitem" id="menu-deconnecter" class="danger">Se déconnecter</button>
					</div>
					<p class="version menu-version"></p>
				</div>
			</div>
			<!-- biome-ignore lint/a11y/useSemanticElements: des pastilles dans l'en-tête, pas un champ de formulaire. -->
			<div id="familles-entete" class="puces puces-entete" role="group" aria-label="Familles affichées"></div>
		</header>

		<!-- Onglets, sélection, bouton flottant : src/App.tsx -->
		<div id="app-react" class="racine-react"></div>
	</div>

	<!-- Scanner de QR code (aussi sur l'écran de connexion) ; les autres fenêtres sont rendues par src/App.tsx -->
	<div id="dialogues"></div>

	<div id="toasts" class="toasts" aria-live="assertive"></div>
	<noscript>Cette app a besoin de JavaScript.</noscript>
</body>
</html>

<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f5f66" />
		<meta name="description" content="Les comptes des apps et les apps ouvertes à chacun." />
		<meta name="robots" content="noindex" />
		<title>Droits</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Droits" />
		<link rel="stylesheet" href="../shared/base.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="entete">
			<h1 id="titre">Droits</h1>
			<button type="button" id="bouton-actualiser" class="bouton-icone" aria-label="Actualiser" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg>
			</button>
			<button type="button" id="bouton-menu" class="bouton-icone" aria-label="Menu" aria-expanded="false" aria-controls="menu" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
			</button>
			<nav id="menu" class="menu" hidden>
				<p id="menu-compte" class="compte"></p>
				<button type="button" id="menu-autre-appareil">Connecter un autre appareil</button>
				<button type="button" id="menu-signalement">Suggestion ou bug</button>
				<button type="button" id="menu-maj">Rechercher une mise à jour</button>
				<button type="button" id="menu-deconnecter">Se déconnecter</button>
				<p class="version"></p>
			</nav>
		</header>
		<div id="chargement" class="chargement" hidden></div>
		<div id="bandeau" class="bandeau" hidden></div>

		<main>
			<section id="ecran-connexion" class="ecran-connexion" hidden>
				<h2>Droits</h2>
				<p>Les comptes des apps et les apps ouvertes à chacun.</p>
				<div id="connexion"></div>
				<p class="version"></p>
			</section>

			<section id="ecran-refus" class="ecran-connexion" hidden>
				<h2>Droits</h2>
				<p id="message-refus" class="aide"></p>
				<button type="button" id="bouton-deconnecter-refus">Se connecter avec un autre compte</button>
			</section>

			<section id="ecran-comptes" hidden>
				<p class="aide">Une app cochée est ouverte aussitôt ; décochée, elle se ferme au plus tard 10 minutes après.</p>
				<div id="liste-comptes"></div>
			</section>
		</main>

		<div id="toasts" class="toasts" aria-live="polite"></div>

		<script src="../shared/config.js"></script>
		<script src="version.js"></script>
		<script src="../shared/vendor/qrcode.min.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>

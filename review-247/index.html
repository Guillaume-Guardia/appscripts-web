<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f5f66" />
		<meta name="description" content="Toutes les apps dans une seule fenêtre installée, avec une seule connexion." />
		<title>Mes apps</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Mes apps" />
		<link rel="stylesheet" href="shared/base.css" />
		<style>
			/* Sur ordinateur, les cartes remplissent la largeur (plusieurs colonnes). */
			main { max-width: none; }
			.apps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
			.app { position: relative; display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
			/* Le lien du titre couvre toute la carte ; les liens des tableaux passent au-dessus. */
			.lien-app { color: inherit; text-decoration: none; }
			.lien-app::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
			.lien-app:focus-visible { outline: none; }
			.app:has(.lien-app:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
			.tableaux { position: relative; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
			.tableaux a { padding: 2px 10px; border: 1px solid var(--bord); border-radius: 999px; color: var(--accent); font-size: 13px; text-decoration: none; }
			.app img { width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0; }
			.app h2 { font-size: 18px; }
			.app p { margin: 2px 0 0; color: var(--texte-doux); font-size: 14px; }
			.sans-acces { opacity: 0.45; filter: grayscale(1); }
			.sans-acces p::after { content: " · Pas encore accès"; }
			.a-venir { box-shadow: none; background: transparent; border-style: dashed; }
			.a-venir .icone { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0; background: var(--surface-2); color: var(--texte-doux); }
			.entete .installer { min-height: 36px; padding: 6px 14px; border-color: currentColor; background: transparent; }
			.a-venir svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
		</style>
	</head>
	<body>
		<header class="entete">
			<h1>Mes apps</h1>
			<!-- Installé, le portail ouvre toutes les apps dans sa fenêtre : une icône, une connexion. -->
			<button type="button" id="installer" class="installer" hidden>Installer</button>
		</header>
		<div id="bandeau" class="bandeau" hidden></div>
		<!-- Cartes des apps et des projets à venir : portail/src/App.tsx -->
		<main id="portail"></main>
		<div id="toasts" class="toasts" aria-live="polite"></div>
		<script src="shared/config.js"></script>
		<script src="version.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>

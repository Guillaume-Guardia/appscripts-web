<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#3b2a1e" />
		<meta name="description" content="Compteurs de durée : temps qui reste à vivre, temps passé aux toilettes ou à dormir, week-ends et Noëls restants, caps de la vie." />
		<title>Compteurs</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Compteurs" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" />
		<link rel="stylesheet" href="../shared/base.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="entete">
			<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9" /></svg>
			<h1>Compteurs</h1>
			<a href="../" class="bouton-icone" aria-label="Mes apps">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
				<span class="infobulle">Mes apps</span>
			</a>
			<button type="button" id="bouton-signalement" class="bouton-icone" aria-label="Suggestion ou bug">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v4M12 14h.01" /></svg>
				<span class="infobulle">Suggestion ou bug</span>
			</button>
			<button type="button" id="bouton-menu" class="bouton-icone" hidden aria-label="Paramètres" aria-expanded="false" aria-controls="menu">
				<span class="avatar" aria-hidden="true"></span>
				<span class="infobulle">Paramètres</span>
			</button>
			<nav id="menu" class="menu" hidden>
				<button type="button" id="menu-profil" class="menu-carte">
					<span class="avatar" aria-hidden="true"></span>
					<span class="menu-carte-texte"><strong id="menu-compte"></strong><span>Mon profil</span></span>
				</button>
				<div class="menu-section">
					<p class="menu-titre">Compteurs</p>
					<button type="button" id="menu-reglages">Mes réglages</button>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Cet appareil</p>
					<button type="button" role="switch" aria-checked="false" id="menu-biometrie" class="bascule" hidden>Biométrie</button>
					<button type="button" id="menu-installer" hidden>Installer l'app</button>
				</div>
				<div class="menu-section">
					<p class="menu-titre">Mes autres appareils</p>
					<button type="button" id="menu-autre-appareil">Connecter un autre appareil</button>
				</div>
				<div class="menu-section">
					<button type="button" id="menu-deconnecter" class="danger">Se déconnecter</button>
				</div>
				<p class="version"></p>
			</nav>
		</header>
		<div id="bandeau" class="bandeau" hidden></div>

		<main id="ecran-connexion" class="ecran-connexion" hidden>
			<h2>Compteurs</h2>
			<p>Le temps qui reste, le temps qui passe : vie, toilettes, sommeil, week-ends, caps.</p>
			<div id="connexion"></div>
			<p class="version"></p>
		</main>

		<main id="ecran-refus" class="ecran-connexion" hidden>
			<h2>Compteurs</h2>
			<p id="message-refus" class="aide"></p>
			<button type="button" id="bouton-deconnecter-refus">Se connecter avec un autre compte</button>
		</main>

		<!-- Contenu, une fois l'accès vérifié (shared/connexion.js, exigerAccesApp) : rendu par React
		     (src/App.tsx), comme les dialogues. -->
		<div id="ecran-app" hidden></div>

		<div id="toasts" class="toasts" aria-live="polite"></div>

		<script src="../shared/config.js"></script>
		<script src="version.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>

<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f5f66" />
		<meta name="description" content="Le planning de Marianne, mois par mois." />
		<meta name="robots" content="noindex" />
		<title>Calendrier</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Calendrier" />
		<link rel="stylesheet" href="../shared/base.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="entete">
			<h1 id="titre">Calendrier</h1>
			<a href="../" class="bouton-icone" aria-label="Mes apps">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
				<span class="infobulle">Mes apps</span>
			</a>
			<button type="button" id="bouton-actualiser" class="bouton-icone" aria-label="Actualiser" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg>
				<span class="infobulle">Actualiser</span>
			</button>
			<button type="button" id="bouton-signalement" class="bouton-icone" aria-label="Suggestion ou bug">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v4M12 14h.01" /></svg>
				<span class="infobulle">Suggestion ou bug</span>
			</button>
			<button type="button" id="bouton-menu" class="bouton-icone" aria-label="Paramètres" aria-expanded="false" aria-controls="menu" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M10.14 5.05L10.4 1.93L13.6 1.93L13.86 5.05L15.6 5.76L18 3.75L20.25 6L18.24 8.4L18.95 10.14L22.07 10.4L22.07 13.6L18.95 13.86L18.24 15.6L20.25 18L18 20.25L15.6 18.24L13.86 18.95L13.6 22.07L10.4 22.07L10.14 18.95L8.4 18.24L6 20.25L3.75 18L5.76 15.6L5.05 13.86L1.93 13.6L1.93 10.4L5.05 10.14L5.76 8.4L3.75 6L6 3.75L8.4 5.76z" /></svg>
				<span class="infobulle">Paramètres</span>
			</button>
			<nav id="menu" class="menu" hidden>
				<p id="menu-compte" class="compte"></p>
				<button type="button" id="menu-inviter">Inviter quelqu'un</button>
				<button type="button" id="menu-autre-appareil">Connecter un autre appareil</button>
				<button type="button" id="menu-connexions">Mes connexions</button>
				<button type="button" id="menu-installer" hidden>Installer l'app</button>
				<button type="button" id="menu-deconnecter">Se déconnecter</button>
				<p class="version"></p>
			</nav>
		</header>
		<div id="chargement" class="chargement" hidden></div>
		<div id="bandeau" class="bandeau" hidden></div>

		<main>
			<section id="ecran-connexion" class="ecran-connexion" hidden>
				<h2>Calendrier</h2>
				<p>Le planning de Marianne, mois par mois.</p>
				<div id="connexion"></div>
				<p class="version"></p>
			</section>

			<section id="ecran-refus" class="ecran-connexion" hidden>
				<h2>Calendrier</h2>
				<p id="message-refus" class="aide"></p>
				<button type="button" id="bouton-deconnecter-refus">Se connecter avec un autre compte</button>
			</section>

			<section id="ecran-planning" hidden>
				<div class="navigation-mois">
					<button type="button" id="mois-precedent" class="bouton-icone" aria-label="Mois précédent">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
					</button>
					<h2 id="titre-mois" aria-live="polite">Planning</h2>
					<button type="button" id="mois-suivant" class="bouton-icone" aria-label="Mois suivant">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
					</button>
					<button type="button" id="bouton-aujourdhui" class="puce">Aujourd'hui</button>
				</div>
				<div class="carte calendrier">
					<div class="jours-semaine" aria-hidden="true">
						<span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
					</div>
					<div id="grille" class="grille"></div>
				</div>
				<button type="button" id="bouton-import" class="bouton-import">Importer une photo du planning</button>
				<input type="file" id="champ-photo" accept="image/*" hidden />
				<div id="detail-jour" class="carte detail-jour" aria-live="polite"></div>
				<div id="statistiques" class="carte statistiques"></div>
				<p id="mise-a-jour" class="aide mise-a-jour"></p>
			</section>
		</main>

		<dialog id="dialogue-droit" class="dialogue" aria-labelledby="titre-dialogue-droit">
			<form id="form-droit" class="formulaire">
				<h2 id="titre-dialogue-droit">Droit à congés</h2>
				<label for="champ-jours-droit">Jours pour l'année</label>
				<input id="champ-jours-droit" type="number" inputmode="decimal" min="0" max="366" step="any" required />
				<p class="erreur" role="alert"></p>
				<div class="boutons">
					<button type="button" data-fermer>Annuler</button>
					<button type="submit" class="bouton-principal">Enregistrer</button>
				</div>
			</form>
		</dialog>

		<dialog id="dialogue-import" class="dialogue" aria-labelledby="titre-dialogue-import">
			<h2 id="titre-dialogue-import">Import du planning</h2>
			<p id="etat-import" role="status"></p>
			<ul id="rapport-import" class="rapport-import"></ul>
			<div id="lien-ocr" class="lien-ocr"></div>
			<form id="form-revue" hidden>
				<p class="aide">Vérifie chaque jour. Un jour « Non renseigné » n'est pas importé, et les jours passés ne changent pas.</p>
				<div id="jours-revue" class="jours-revue"></div>
				<p class="erreur" role="alert"></p>
			</form>
			<div class="boutons">
				<button type="button" id="fermer-import" data-fermer>Fermer</button>
				<button type="submit" form="form-revue" id="valider-import" class="bouton-principal" hidden>Valider et créer les événements</button>
			</div>
		</dialog>

		<div id="toasts" class="toasts" aria-live="polite"></div>

		<script src="../shared/config.js"></script>
		<script src="config.js"></script>
		<script src="version.js"></script>
		<script src="../shared/vendor/qrcode.min.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>

<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#24477a" />
		<meta name="description" content="Simulateur d'investissement locatif : frais, crédit, loyer net, cash-flow et rendement d'un bien." />
		<title>Investissement</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Investissement" />
		<link rel="stylesheet" href="../shared/base.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="entete">
			<h1>Simuler un bien</h1>
			<button type="button" id="bouton-menu" class="bouton-icone" aria-label="Menu" aria-expanded="false" aria-controls="menu">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
			</button>
			<nav id="menu" class="menu" hidden>
				<button type="button" id="menu-parametres">Paramètres du calcul</button>
				<button type="button" id="menu-effacer">Effacer la simulation</button>
				<p class="menu-titre">Application</p>
				<button type="button" id="menu-installer" hidden>Installer l'app</button>
				<button type="button" id="menu-signalement">Suggestion ou bug</button>
				<button type="button" id="menu-maj">Rechercher une mise à jour</button>
				<p class="version"></p>
			</nav>
		</header>
		<div id="bandeau" class="bandeau" hidden></div>

		<!-- Les chiffres clés restent visibles pendant la saisie. -->
		<section class="chiffres-cles" aria-live="polite">
			<div>
				<span class="libelle">Cash-flow</span>
				<strong id="cle-cash-flow">—</strong>
				<span class="unite">par mois</span>
			</div>
			<div>
				<span class="libelle">Rendement net</span>
				<strong id="cle-rendement">—</strong>
				<span class="unite">par an</span>
			</div>
			<div>
				<span class="libelle">Mensualité</span>
				<strong id="cle-mensualite">—</strong>
				<span class="unite">de crédit</span>
			</div>
		</section>

		<main>
			<form id="form-simulation" class="formulaire" novalidate>
				<section class="carte bloc">
					<h2>Achat</h2>
					<div class="dates">
						<div>
							<label for="champ-prix">Prix</label>
							<input id="champ-prix" name="prix" type="number" inputmode="decimal" min="0" step="any" placeholder="165 000 €" />
						</div>
						<div>
							<label for="champ-superficie">Superficie</label>
							<input id="champ-superficie" name="superficie" type="number" inputmode="decimal" min="0" step="any" placeholder="68 m²" />
						</div>
					</div>
					<fieldset>
						<legend>Logement</legend>
						<div class="puces">
							<button type="button" class="puce" data-neuf="non" aria-pressed="true">Ancien</button>
							<button type="button" class="puce" data-neuf="oui" aria-pressed="false">Neuf</button>
						</div>
					</fieldset>
					<div class="dates">
						<div>
							<label for="champ-frais-agence">Frais d'agence</label>
							<input id="champ-frais-agence" name="fraisAgence" type="number" inputmode="decimal" min="0" step="any" />
						</div>
						<div>
							<label for="champ-travaux">Travaux</label>
							<input id="champ-travaux" name="travaux" type="number" inputmode="decimal" min="0" step="any" placeholder="0 €" />
						</div>
					</div>
				</section>

				<section class="carte bloc">
					<h2>Financement</h2>
					<label for="champ-apport">Apport</label>
					<input id="champ-apport" name="apport" type="number" inputmode="decimal" min="0" step="any" placeholder="0 €" />
					<div class="dates">
						<div>
							<label for="champ-taux">Taux</label>
							<input id="champ-taux" name="taux" type="number" inputmode="decimal" min="0" step="any" placeholder="3,6 %" />
						</div>
						<div>
							<label for="champ-duree">Durée</label>
							<input id="champ-duree" name="duree" type="number" inputmode="numeric" min="0" max="40" step="1" placeholder="20 ans" />
						</div>
					</div>
				</section>

				<section class="carte bloc">
					<h2>Location</h2>
					<label for="champ-loyer">Loyer par mois, hors charges</label>
					<input id="champ-loyer" name="loyer" type="number" inputmode="decimal" min="0" step="any" />
				</section>
			</form>

			<section class="carte bloc">
				<h2>Détail</h2>
				<dl id="detail" class="detail"></dl>
			</section>
		</main>

		<dialog id="dialogue-parametres" class="dialogue" aria-labelledby="titre-parametres">
			<form id="form-parametres" class="formulaire" method="dialog">
				<h2 id="titre-parametres">Paramètres du calcul</h2>
				<p class="aide">Ceux de l'onglet DATA du classeur, gardés sur ce téléphone.</p>
				<div class="dates">
					<div>
						<label for="param-notaireAncien">Notaire ancien (%)</label>
						<input id="param-notaireAncien" name="notaireAncien" type="number" inputmode="decimal" min="0" step="any" required />
					</div>
					<div>
						<label for="param-notaireNeuf">Notaire neuf (%)</label>
						<input id="param-notaireNeuf" name="notaireNeuf" type="number" inputmode="decimal" min="0" step="any" required />
					</div>
					<div>
						<label for="param-agence">Agence (% du prix)</label>
						<input id="param-agence" name="agence" type="number" inputmode="decimal" min="0" step="any" required />
					</div>
					<div>
						<label for="param-loyerM2">Loyer (€/m²/mois)</label>
						<input id="param-loyerM2" name="loyerM2" type="number" inputmode="decimal" min="0" step="any" required />
					</div>
					<div>
						<label for="param-taxeFonciereM2">Taxe foncière (€/m²/an)</label>
						<input id="param-taxeFonciereM2" name="taxeFonciereM2" type="number" inputmode="decimal" min="0" step="any" required />
					</div>
					<div>
						<label for="param-charges">Charges (% du loyer)</label>
						<input id="param-charges" name="charges" type="number" inputmode="decimal" min="0" step="any" required />
					</div>
					<div>
						<label for="param-assurancePno">Assurance PNO (€/mois)</label>
						<input id="param-assurancePno" name="assurancePno" type="number" inputmode="decimal" min="0" step="any" required />
					</div>
				</div>
				<div class="boutons">
					<button type="button" id="bouton-parametres-defaut">Valeurs par défaut</button>
					<button type="submit" class="bouton-principal">Fermer</button>
				</div>
			</form>
		</dialog>


		<div id="toasts" class="toasts" aria-live="polite"></div>

		<script src="../shared/config.js"></script>
		<script src="version.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>
